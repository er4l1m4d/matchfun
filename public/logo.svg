<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Soccer ball base -->
  <circle cx="32" cy="32" r="28" fill="url(#orangeGrad)" stroke="var(--orange-500)" stroke-width="1.5"/>
  
  <!-- Soccer ball pentagon pattern (simplified) -->
  <g fill="none" stroke="var(--orange-300)" stroke-width="1.2" opacity="0.6">
    <path d="M32 8 L32 20"/>
    <path d="M32 44 L32 56"/>
    <path d="M8 32 L20 32"/>
    <path d="M44 32 L56 32"/>
    <path d="M16 16 L24 24"/>
    <path d="M40 40 L48 48"/>
    <path d="M16 48 L24 40"/>
    <path d="M40 24 L48 16"/>
  </g>
  
  <!-- Touch/press hand icon -->
  <g fill="var(--orange-500)">
    <!-- Finger tip circle -->
    <circle cx="32" cy="32" r="6" />
    <!-- Finger stem -->
    <rect x="29" y="38" width="6" height="14" rx="3"/>
    <!-- Pulse rings -->
    <circle cx="32" cy="32" r="14" stroke="var(--orange-400)" stroke-width="2" fill="none" opacity="0.4">
      <animate attributeName="r" values="14;20" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="32" cy="32" r="14" stroke="var(--orange-400)" stroke-width="1.5" fill="none" opacity="0.2">
      <animate attributeName="r" values="14;22" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <defs>
    <radialGradient id="orangeGrad" cx="32" cy="32" r="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="var(--orange-400)"/>
      <stop offset="100%" stop-color="var(--orange-600)"/>
    </radialGradient>
  </defs>
</svg>